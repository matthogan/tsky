version: 2

project_name: tsky-agent

before:
  hooks:
    - go mod tidy
    - make proto

builds:
  - id: tsky-agent
    main: ./cmd/tsky-agent
    binary: tsky-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - tsky-remote-agent-technical-spec-v0.2.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
