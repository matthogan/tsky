syntax = "proto3";

package tsky.agent.v1;

option csharp_namespace = "Tsky.Agent.V1";
option go_package = "github.com/matthogan/tsky/agent/protocol/tsky/agent/v1;agentv1";

import "tsky/agent/v1/acknowledgement.proto";
import "tsky/agent/v1/artifact.proto";
import "tsky/agent/v1/run.proto";

// Reconciliation.

message ReconciliationRequest {
  string reconciliation_id = 1;
  repeated AttemptAcknowledgement controller_cursors = 2;
  bool include_recent_terminal_attempts = 3;
}

message ReconciledAttempt {
  string run_id = 1;
  string attempt_id = 2;
  bytes plan_digest_sha256 = 3;
  RunAttemptState state = 4;
  uint64 highest_local_event_sequence = 5;
  repeated OutputAcknowledgement highest_local_output_sequences = 6;
  bool process_is_known_running = 7;
  repeated ArtifactUploadState artifact_uploads = 8;
}

message ReconciliationResponse {
  string reconciliation_id = 1;
  repeated ReconciledAttempt attempts = 2;
}
