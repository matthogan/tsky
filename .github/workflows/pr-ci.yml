name: pr-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.xaml"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/pr-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore-build-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, windows, tsky-local]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
            nuget.config

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build .\Tsky.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\tsky.Tests\tsky.Tests.csproj --configuration Release --no-build
