syntax = "proto3";

package tsky.agent.v1;

option csharp_namespace = "Tsky.Agent.V1";
option go_package = "github.com/matthogan/tsky/agent/protocol/tsky/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";

// Draft companion IDL for Tsky Agent Protocol (TAP) v1.
// The written state-machine and security rules in the technical specification
// remain normative where this draft does not yet define behaviour completely.

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message ProtocolBinding {
  string profile = 1; // e.g. "tap-grpc"
  string version = 2; // e.g. "1"
  string endpoint = 3;
  bool optional = 4;
}

message FrameHeader {
  string protocol = 1; // MUST be "tap"
  ProtocolVersion version = 2;
  string message_id = 3;
  google.protobuf.Timestamp sent_at = 4;
  string correlation_id = 5;
  uint64 sequence = 6;
  map<string, string> metadata = 7;
}

message ExtensionSupport {
  string identifier = 1;
  string version = 2;
  bool required = 3;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
  OUTPUT_STREAM_SYSTEM = 3;
}

message ProtocolPing {
  string ping_id = 1;
  google.protobuf.Timestamp sent_at = 2;
}

message ProtocolPong {
  string ping_id = 1;
  google.protobuf.Timestamp received_at = 2;
}
