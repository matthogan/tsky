name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-quality-gates:
    runs-on: ${{ fromJSON(vars.TSKY_RUNNER_LABELS || '["self-hosted","windows","tsky-local"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
            nuget.config

      - name: Restore
        run: dotnet restore

      - name: Clean previous analyzer reports
        shell: pwsh
        run: |
          if (Test-Path .\artifacts\analyzers) {
            Remove-Item .\artifacts\analyzers -Recurse -Force
          }

      - name: Build with analyzer/style report
        shell: pwsh
        run: |
          $analyzerOutputDir = Join-Path $PWD "artifacts/analyzers"
          New-Item -Path $analyzerOutputDir -ItemType Directory -Force | Out-Null
          $sarifPath = Join-Path $analyzerOutputDir "current.sarif"
          dotnet build .\Tsky.sln --configuration Release --no-restore --no-incremental /p:ErrorLog=$sarifPath

      - name: Enforce analyzer/style baseline
        shell: pwsh
        run: |
          $sarifPath = Join-Path $PWD "artifacts/analyzers/current.sarif"
          .\scripts\verify-analyzer-style-baseline.ps1 -BaselinePath .\eng\analyzers\baseline.json -CurrentSarifPath $sarifPath -RepoRoot .

      - name: Clean previous coverage reports
        shell: pwsh
        run: |
          if (Test-Path .\artifacts\testresults) {
            Remove-Item .\artifacts\testresults -Recurse -Force
          }

      - name: Test with coverage
        shell: pwsh
        run: |
          $coverageOutput = Join-Path $PWD "artifacts/testresults/coverage"
          dotnet test .\tsky.Tests\tsky.Tests.csproj --configuration Release --no-build /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=$coverageOutput

      - name: Enforce critical coverage thresholds
        shell: pwsh
        run: .\scripts\verify-coverage-thresholds.ps1 -CoverageRoot .\artifacts\testresults

  build-and-release:
    needs: release-quality-gates
    runs-on: ${{ fromJSON(vars.TSKY_RUNNER_LABELS || '["self-hosted","windows","tsky-local"]') }}
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "github.ref_name is empty."
          }

          if ($tag.StartsWith("v")) {
            $version = $tag.Substring(1)
          }
          else {
            $version = $tag
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z\.-]+)?$') {
            throw "Tag '$tag' does not map to a valid semantic version (expected vMAJOR.MINOR.PATCH[-suffix])."
          }

          $coreVersion = $version.Split('-')[0]
          $assemblyVersion = "$coreVersion.0"

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSEMBLY_VERSION=$assemblyVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore

      - name: Publish (${{ matrix.runtime }})
        shell: pwsh
        run: |
          dotnet publish .\src\Tsky.Desktop\Tsky.Desktop.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:Version=$env:APP_VERSION `
            -p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            -p:FileVersion=$env:ASSEMBLY_VERSION `
            -p:InformationalVersion=$env:APP_VERSION `
            -o .\artifacts\publish\${{ matrix.runtime }}

      - name: Package zip (${{ matrix.runtime }})
        shell: pwsh
        run: |
          $zipName = "tsky-$env:APP_VERSION-${{ matrix.runtime }}.zip"
          $zipPath = Join-Path ".\artifacts" $zipName

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path ".\artifacts\publish\${{ matrix.runtime }}\*" -DestinationPath $zipPath

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsky-${{ matrix.runtime }}
          path: artifacts/tsky-${{ env.APP_VERSION }}-${{ matrix.runtime }}.zip

  create-release:
    runs-on: ${{ fromJSON(vars.TSKY_RUNNER_LABELS || '["self-hosted","windows","tsky-local"]') }}
    needs: build-and-release

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
